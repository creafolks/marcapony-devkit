name: Publish CLI

# The CLI is the one artifact end users install (`bunx marcapony`), so it goes
# to PUBLIC npm — unlike the @creafolks/* packages, which stay on GitHub
# Packages. Releases are driven entirely by the version in cli/package.json:
# this job compares it against what npm already serves and exits quietly when
# they match, so a re-run, an unrelated main push, or a publish someone did by
# hand can never double-publish.
#
# Auth is npm Trusted Publishing (OIDC), not a token. npm no longer offers a
# classic "Automation" token, and every other token type either prompts for an
# OTP in CI (EOTP) or needs a 2FA-bypass flag npm itself warns against. OIDC
# has no long-lived credential to leak or rotate. It requires a trusted
# publisher configured on npmjs.com for the `marcapony` package pointing at
# creafolks/marcapony-devkit + this exact workflow filename.
#
# This repository is public, so npm attaches provenance to trusted-publishing
# releases on its own; no `--provenance` flag is needed.
on:
  workflow_dispatch:

  push:
    branches:
      - main
    # Only the package's own directory. Root files (bun.lock, package.json,
    # tsconfig.base.json, biome.json) deliberately do not trigger a publish:
    # nothing ships until cli/package.json gets a new version, and that
    # change lands under cli/ anyway. Use workflow_dispatch to force a run.
    paths:
      - 'cli/**'

permissions:
  # OIDC token for trusted publishing.
  id-token: write
  # Pushing the cli-v<version> tag.
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1. Node 24 bundles an npm that is
      # close to but not reliably above that line, so pin the floor explicitly
      # rather than inherit whatever the runner image happens to ship.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest && npm --version

      - name: Decide whether this version needs publishing
        id: decide
        working-directory: cli
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          # A never-published package 404s here; treat that as "publish it".
          REMOTE=$(npm view marcapony version 2>/dev/null || echo "none")
          echo "local=$LOCAL remote=$REMOTE"
          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "marcapony@$LOCAL is already on npm — nothing to do."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "version=$LOCAL" >> "$GITHUB_OUTPUT"
          fi

      # The repository is a Bun workspace with one lockfile at the root, so
      # install there; build, test and publish still run from cli/.
      - name: Install dependencies
        if: steps.decide.outputs.publish == 'true'
        run: bun install --frozen-lockfile

      - name: Type check + test + build
        if: steps.decide.outputs.publish == 'true'
        run: bunx tsc --noEmit && bun test && bun run build
        working-directory: cli

      - name: Publish
        if: steps.decide.outputs.publish == 'true'
        run: npm publish --access public
        working-directory: cli

      - name: Tag the released commit
        if: steps.decide.outputs.publish == 'true'
        run: |
          TAG="cli-v${{ steps.decide.outputs.version }}"
          git tag "$TAG"
          git push origin "$TAG"
